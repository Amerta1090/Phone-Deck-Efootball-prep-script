<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone Deck</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #13171c; --line: #222a33; --text: #e6edf3;
    --dim: #7d8a99; --accent: #3ddc84; --warn: #ffb020; --hot: #ff5c5c;
    font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .08em; text-transform: uppercase; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--hot); }
  .dot.on { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  #device { color: var(--dim); font-size: 13px; }
  main { display: grid; grid-template-columns: auto 1fr; gap: 28px; padding: 24px; max-width: 1100px; margin: 0 auto; }
  .phone { position: relative; width: 300px; aspect-ratio: 1080 / 2408; border-radius: 34px; padding: 10px;
           background: #000; border: 2px solid #2b333d; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .phone img { width: 100%; height: 100%; border-radius: 26px; display: block; cursor: crosshair;
               user-select: none; -webkit-user-drag: none; background: #050607; }
  .ripple { position: absolute; width: 36px; height: 36px; margin: -18px; border-radius: 50%;
            border: 2px solid var(--accent); pointer-events: none; animation: rip .5s ease-out forwards; }
  @keyframes rip { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
  .side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  .value { font-size: 26px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .value small { font-size: 13px; color: var(--dim); }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .6s; }
  .fg { font-size: 14px; word-break: break-all; margin-top: 6px; color: var(--accent); }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  button, input { font: inherit; font-size: 13px; color: var(--text); background: var(--panel);
                  border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; }
  input:focus { outline: none; border-color: var(--accent); }
  .hint { font-size: 12px; color: var(--dim); }
  #log { font-size: 12px; color: var(--dim); height: 110px; overflow: auto; }
  #log div::before { content: "› "; color: var(--accent); }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; padding: 16px; } .phone { margin: 0 auto; width: 240px; } }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>Phone Deck</h1>
  <span id="device">connecting…</span>
</header>
<main>
  <div class="phone" id="phone"><img id="screen" alt="phone screen" draggable="false"></div>
  <div class="side">
    <div class="grid">
      <div class="card"><div class="label">Battery</div><div class="value" id="batt">–</div><div class="bar"><i id="battBar"></i></div></div>
      <div class="card"><div class="label">Temperature</div><div class="value" id="temp">–</div></div>
      <div class="card"><div class="label">RAM</div><div class="value" id="ram">–</div><div class="bar"><i id="ramBar"></i></div></div>
      <div class="card"><div class="label">Storage</div><div class="value" id="disk">–</div><div class="bar"><i id="diskBar"></i></div></div>
      <div class="card"><div class="label">Uptime</div><div class="value" id="up">–</div></div>
      <div class="card"><div class="label">Screen</div><div class="value" id="scr">–</div></div>
    </div>
    <div class="card"><div class="label">Foreground app</div><div class="fg" id="fg">–</div></div>
    <div class="buttons">
      <button data-a="back">◀ Back</button>
      <button data-a="home">● Home</button>
      <button data-a="recents">■ Recents</button>
      <button data-a="wake">☀ Wake</button>
      <button data-a="power">⏻ Power</button>
      <button data-a="vol_down">🔉 Vol −</button>
      <button data-a="vol_up">🔊 Vol +</button>
      <button data-a="play">⏯ Play/Pause</button>
    </div>
    <form id="typeForm">
      <input id="typeInput" placeholder="Type into the focused field on your phone…" autocomplete="off">
      <button>Send</button>
    </form>
    <div class="hint">Click the screen to tap. Drag on it to swipe.</div>
    <div class="card" id="log"></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let dims = { width: 1080, height: 2408 };

function log(msg) {
  const d = document.createElement("div");
  d.textContent = `${new Date().toLocaleTimeString()}  ${msg}`;
  $("log").prepend(d);
}

async function act(body, label) {
  log(label || body.action);
  await fetch("/api/action", { method: "POST", body: JSON.stringify(body) });
  setTimeout(refreshScreen, 350);
}

async function refreshStats() {
  try {
    const s = await (await fetch("/api/stats")).json();
    $("dot").classList.toggle("on", s.connected);
    if (!s.connected) { $("device").textContent = "no device"; return; }
    dims = s;
    $("phone").style.aspectRatio = `${s.width} / ${s.height}`;
    $("device").textContent = `${s.device} · Android ${s.android}`;
    $("batt").innerHTML = `${s.battery}<small>%${s.charging ? " ⚡" : ""}</small>`;
    $("battBar").style.width = s.battery + "%";
    $("battBar").style.background = s.battery < 20 ? "var(--hot)" : "var(--accent)";
    $("temp").innerHTML = `${s.temp_c}<small>°C</small>`;
    $("temp").style.color = s.temp_c > 40 ? "var(--hot)" : s.temp_c > 35 ? "var(--warn)" : "";
    $("ram").innerHTML = `${s.ram_used_pct}<small>% of ${s.ram_total_gb}G</small>`;
    $("ramBar").style.width = s.ram_used_pct + "%";
    $("disk").innerHTML = `${s.storage_used_pct}<small>% of ${s.storage_total_gb}G</small>`;
    $("diskBar").style.width = s.storage_used_pct + "%";
    $("up").innerHTML = `${s.uptime_h}<small>h</small>`;
    $("scr").textContent = s.screen_on ? "ON" : "OFF";
    $("fg").textContent = s.foreground;
  } catch { $("dot").classList.remove("on"); }
}

let loading = false;
function refreshScreen() {
  if (loading) return;
  loading = true;
  const img = new Image();
  img.onload = () => { $("screen").src = img.src; loading = false; };
  img.onerror = () => { loading = false; };
  img.src = "/api/screen?" + Date.now();
}

// Map a click on the <img> to phone pixel coordinates
function toPhone(e) {
  const r = $("screen").getBoundingClientRect();
  return {
    x: Math.round((e.clientX - r.left) / r.width * dims.width),
    y: Math.round((e.clientY - r.top) / r.height * dims.height),
    px: e.clientX - $("phone").getBoundingClientRect().left,
    py: e.clientY - $("phone").getBoundingClientRect().top,
  };
}

let down = null;
$("screen").addEventListener("pointerdown", e => { down = toPhone(e); });
$("screen").addEventListener("pointerup", e => {
  if (!down) return;
  const up = toPhone(e);
  const r = document.createElement("span");
  r.className = "ripple"; r.style.left = up.px + "px"; r.style.top = up.py + "px";
  $("phone").appendChild(r); setTimeout(() => r.remove(), 500);
  if (Math.hypot(up.x - down.x, up.y - down.y) < 30) act({ action: "tap", x: up.x, y: up.y }, `tap ${up.x},${up.y}`);
  else act({ action: "swipe", x1: down.x, y1: down.y, x2: up.x, y2: up.y }, `swipe → ${up.x},${up.y}`);
  down = null;
});

document.querySelectorAll("[data-a]").forEach(b => b.onclick = () => act({ action: b.dataset.a }));
$("typeForm").onsubmit = e => {
  e.preventDefault();
  const text = $("typeInput").value;
  if (text) act({ action: "text", text }, `type "${text}"`);
  $("typeInput").value = "";
};

refreshStats(); refreshScreen();
setInterval(refreshStats, 3000);
setInterval(refreshScreen, 1200);
</script>
</body>
</html>
